[theme]
base = "dark"
primaryColor = "#a78bfa"
backgroundColor = "#0f0c29"
secondaryBackgroundColor = "#1e1e2e"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
enableCORS = false
# Task D: uploads are held in memory only; 50 MB is ample for a daily return
# panel and keeps a stray tick-data file from exhausting the app's memory.
maxUploadSize = 50
